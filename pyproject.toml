[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimtrace"
version = "0.1.0"
description = "Traceable review packages for PyMOL, ChimeraX, and MolViewSpec molecular figures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Shuyu Zhong" }
]
keywords = [
  "molecular-visualization",
  "scientific-claims",
  "auditability",
  "pymol",
  "chimerax",
  "molviewspec",
  "json-schema"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.16",
  "rich>=13",
  "jsonschema>=4.22",
  "PyYAML>=6.0.1",
  "Pillow>=10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5",
  "ruff>=0.9"
]

[project.urls]
Homepage = "https://github.com/GeraltZeroZhong/ClaimTrace"
Repository = "https://github.com/GeraltZeroZhong/ClaimTrace"
Issues = "https://github.com/GeraltZeroZhong/ClaimTrace/issues"

[project.scripts]
claimtrace = "claimtrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimtrace = [
  "py.typed",
  "resources/schema/*.json",
  "resources/validation/*.yaml",
  "resources/templates/*.yml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "experimental: tests for experimental importers or exporters"
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
