[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimtrace"
version = "0.1.0"
description = "Traceable review packages for PyMOL, ChimeraX, and MolViewSpec molecular figures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ClaimTrace contributors" }
]
keywords = [
  "molecular-visualization",
  "scientific-claims",
  "auditability",
  "pymol",
  "chimerax",
  "molviewspec",
  "json-schema"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.22",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
network = ["requests>=2.32"]
structure = []
md = []
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5"
]

[project.scripts]
claimtrace = "claimtrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimtrace = [
  "py.typed",
  "resources/schema/*.json",
  "resources/validation/*.yaml",
  "resources/templates/*.yml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "experimental: tests for experimental importers or exporters"
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
